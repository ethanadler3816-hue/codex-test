<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Chess Bot</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent: #22c55e;
        --light-square: #f0d9b5;
        --dark-square: #b58863;
        --selected: #3b82f6;
        --legal: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1f2937 0%, #111827 60%);
        color: var(--text);
        font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      .app {
        width: min(95vw, 900px);
        display: grid;
        grid-template-columns: minmax(320px, 560px) minmax(220px, 1fr);
        gap: 1.25rem;
        align-items: start;
      }

      .board {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 35px rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.08);
        display: grid;
        grid-template-columns: repeat(8, 1fr);
      }

      .square {
        border: none;
        margin: 0;
        padding: 0;
        font-size: clamp(1.6rem, 4.2vw, 2.5rem);
        line-height: 1;
        cursor: pointer;
        transition: filter 0.12s ease;
      }

      .square:hover {
        filter: brightness(1.06);
      }

      .light {
        background: var(--light-square);
      }

      .dark {
        background: var(--dark-square);
      }

      .selected {
        outline: 3px solid var(--selected);
        outline-offset: -3px;
      }

      .legal::after {
        content: "";
        width: 22%;
        height: 22%;
        border-radius: 50%;
        background: color-mix(in srgb, var(--legal) 70%, white 30%);
        display: block;
        margin: auto;
        transform: translateY(70%);
      }

      .panel {
        background: color-mix(in srgb, var(--panel) 94%, black 6%);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem;
        display: grid;
        gap: 0.8rem;
      }

      h1 {
        margin: 0;
        font-size: 1.2rem;
      }

      .status {
        margin: 0;
        font-weight: 600;
        color: var(--accent);
      }

      .meta {
        color: var(--muted);
        margin: 0;
        font-size: 0.95rem;
      }

      .moves {
        background: rgba(0, 0, 0, 0.22);
        border-radius: 8px;
        padding: 0.6rem;
        min-height: 120px;
        max-height: 220px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9rem;
      }

      .buttons {
        display: flex;
        gap: 0.6rem;
      }

      button.control {
        flex: 1;
        border: none;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        color: white;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      }

      button.control.secondary {
        background: linear-gradient(180deg, #6b7280, #374151);
      }

      @media (max-width: 800px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div id="board" class="board" aria-label="Chess board"></div>
      <aside class="panel">
        <h1>Simple Chess vs Bot</h1>
        <p id="status" class="status"></p>
        <p id="turn" class="meta"></p>
        <div class="meta" style="line-height: 1.4">
          <strong style="color: #d1d5db">How to start:</strong>
          <div>1) Click any white piece.</div>
          <div>2) Click a highlighted target square to move.</div>
        </div>
        <div>
          <p class="meta" style="margin: 0 0 0.3rem">Moves (SAN)</p>
          <div id="move-list" class="moves" aria-live="polite"></div>
        </div>
        <div class="buttons">
          <button id="new-game" class="control">New Game</button>
          <button id="undo" class="control secondary">Undo Last Turn</button>
        </div>
        <p class="meta">You play as White. The bot picks a random legal move as Black.</p>
      </aside>
    </main>

    <script type="module">
      import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.1.0/+esm";

      const boardElement = document.getElementById("board");
      const statusElement = document.getElementById("status");
      const turnElement = document.getElementById("turn");
      const moveListElement = document.getElementById("move-list");
      const newGameBtn = document.getElementById("new-game");
      const undoBtn = document.getElementById("undo");

      const PIECES = {
        p: "♟", r: "♜", n: "♞", b: "♝", q: "♛", k: "♚",
        P: "♙", R: "♖", N: "♘", B: "♗", Q: "♕", K: "♔"
      };

      const game = new Chess();
      let selectedSquare = null;
      let legalTargets = [];

      function createBoard() {
        boardElement.innerHTML = "";
        const files = "abcdefgh";

        for (let rank = 8; rank >= 1; rank--) {
          for (let fileIndex = 0; fileIndex < 8; fileIndex++) {
            const file = files[fileIndex];
            const square = `${file}${rank}`;
            const isLight = (rank + fileIndex) % 2 === 0;

            const button = document.createElement("button");
            button.className = `square ${isLight ? "light" : "dark"}`;
            button.dataset.square = square;
            button.setAttribute("aria-label", `square ${square}`);
            button.addEventListener("click", () => onSquareClick(square));
            boardElement.appendChild(button);
          }
        }
      }

      function render() {
        const board = game.board();
        const files = "abcdefgh";

        document.querySelectorAll(".square").forEach((squareBtn) => {
          const square = squareBtn.dataset.square;
          const file = files.indexOf(square[0]);
          const rank = Number(square[1]);
          const piece = board[8 - rank][file];

          squareBtn.textContent = piece ? PIECES[piece.color === "w" ? piece.type.toUpperCase() : piece.type] : "";
          squareBtn.classList.toggle("selected", square === selectedSquare);
          squareBtn.classList.toggle("legal", legalTargets.includes(square));
        });

        renderStatus();
        renderMoveList();
      }

      function renderStatus() {
        if (game.isCheckmate()) {
          const winner = game.turn() === "w" ? "Black" : "White";
          statusElement.textContent = `Checkmate! ${winner} wins.`;
        } else if (game.isDraw()) {
          statusElement.textContent = "Draw game.";
        } else if (game.inCheck()) {
          statusElement.textContent = `${game.turn() === "w" ? "White" : "Black"} is in check.`;
        } else {
          statusElement.textContent = game.history().length
            ? "Game in progress."
            : "Your move: click a white piece to start.";
        }

        turnElement.textContent = `Turn: ${game.turn() === "w" ? "White (you)" : "Black (bot)"}`;
      }

      function renderMoveList() {
        const history = game.history();
        if (!history.length) {
          moveListElement.textContent = "No moves yet.";
          return;
        }

        const rows = [];
        for (let i = 0; i < history.length; i += 2) {
          const moveNo = Math.floor(i / 2) + 1;
          const white = history[i] || "";
          const black = history[i + 1] || "";
          rows.push(`${moveNo}. ${white} ${black}`.trim());
        }
        moveListElement.innerHTML = rows.map((row) => `<div>${row}</div>`).join("");
        moveListElement.scrollTop = moveListElement.scrollHeight;
      }

      function clearSelection() {
        selectedSquare = null;
        legalTargets = [];
      }

      function onSquareClick(square) {
        if (game.isGameOver() || game.turn() !== "w") {
          return;
        }

        const piece = game.get(square);

        if (selectedSquare && legalTargets.includes(square)) {
          const move = game.move({ from: selectedSquare, to: square, promotion: "q" });
          if (move) {
            clearSelection();
            render();
            window.setTimeout(botMove, 280);
            return;
          }
        }

        if (piece && piece.color === "w") {
          selectedSquare = square;
          legalTargets = game.moves({ square, verbose: true }).map((m) => m.to);
        } else {
          clearSelection();
        }

        render();
      }

      function botMove() {
        if (game.isGameOver() || game.turn() !== "b") {
          render();
          return;
        }

        const moves = game.moves({ verbose: true });
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        game.move(randomMove);
        render();
      }

      newGameBtn.addEventListener("click", () => {
        game.reset();
        clearSelection();
        render();
      });

      undoBtn.addEventListener("click", () => {
        if (!game.history().length) return;
        game.undo();
        if (game.turn() === "b" && game.history().length) {
          game.undo();
        }
        clearSelection();
        render();
      });

      createBoard();
      render();
    </script>
  </body>
</html>
